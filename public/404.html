<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEZENT — Enterprise SaaS Navigation Shell</title>
    <script>
      (function() {
        var base = "/bezent_ui/";
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) {
          var subPath = path.slice(base.length);
          if (subPath) {
            window.location.replace(base + "#/" + subPath + window.location.search + window.location.hash);
            return;
          }
        }
        window.location.replace(base);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0F0318; color: #FFFFFF;">
    <p>Redirecting to <a href="/bezent_ui/" style="color: #931CF5; text-decoration: underline;">BEZENT</a>...</p>
  </body>
</html>
